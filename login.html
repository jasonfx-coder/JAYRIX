<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JAYRIX - Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-page">


    <div class="auth-glow glow-one"></div>
    <div class="auth-glow glow-two"></div>


    <div class="auth-container">


        <div class="logo">
            J
        </div>


        <div class="brand">
            JAYRIX
        </div>


        <div class="subtitle">
            WELCOME BACK
        </div>


        <form id="loginForm">


            <label>
                Phone Number or Email
            </label>

            <input
                type="text"
                id="identifier"
                placeholder="Phone number or email"
                autocomplete="username"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Your password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <p class="switch">

            Don't have an account?

            <a href="signup.html">
                Create one
            </a>

        </p>


    </div>


</div>


<script>

const form =
    document.getElementById(
        "loginForm"
    );


const button =
    document.getElementById(
        "loginButton"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const identifier =
            document
            .getElementById("identifier")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        message.textContent = "";


        button.disabled = true;

        button.textContent =
            "Logging in...";


        try {

            const response =
                await fetch(
                    "/api/login",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                identifier:
                                    identifier,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                showMessage(
                    "Login successful!",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );


            } else {

                showMessage(
                    data.message ||
                    "Login failed.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Login";

            }


        } catch (error) {

            showMessage(
                "Unable to connect to JAYRIX.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Login";

        }

    }
);


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}

</script>


</body>

</html>
