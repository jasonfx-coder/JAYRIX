<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>JAYRIX - Create Account</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-page">


    <div class="auth-glow glow-one"></div>
    <div class="auth-glow glow-two"></div>


    <div class="auth-container">


        <div class="logo">
            J
        </div>


        <div class="brand">
            JAYRIX
        </div>


        <div class="subtitle">
            CREATE YOUR ACCOUNT
        </div>


        <form id="signupForm">


            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Choose a username"
                autocomplete="username"
                required
            >


            <label>
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="Your phone number"
                autocomplete="tel"
                required
            >


            <label>
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Your email address"
                autocomplete="email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create a password"
                autocomplete="new-password"
                required
            >


            <label>
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm your password"
                autocomplete="new-password"
                required
            >


            <button
                type="submit"
                id="signupButton"
            >
                Create Account
            </button>


        </form>


        <div
            id="message"
            class="message"
        ></div>


        <p class="switch">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </p>


    </div>


</div>


<script>

const form =
    document.getElementById(
        "signupForm"
    );


const button =
    document.getElementById(
        "signupButton"
    );


const message =
    document.getElementById(
        "message"
    );


form.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const username =
            document
            .getElementById("username")
            .value
            .trim();


        const phone =
            document
            .getElementById("phone")
            .value
            .trim();


        const email =
            document
            .getElementById("email")
            .value
            .trim();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        if (
            password !==
            confirmPassword
        ) {

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        if (password.length < 6) {

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            const response =
                await fetch(
                    "/api/signup",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                username:
                                    username,

                                phone:
                                    phone,

                                email:
                                    email,

                                password:
                                    password

                            })

                    }
                );


            const data =
                await response.json();


            if (data.success) {

                showMessage(
                    "Account created successfully!",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "login.html";

                    },
                    1000
                );


            } else {

                showMessage(
                    data.message ||
                    "Unable to create account.",
                    "error"
                );

                button.disabled = false;

                button.textContent =
                    "Create Account";

            }


        } catch (error) {

            showMessage(
                "Unable to connect to JAYRIX.",
                "error"
            );

            button.disabled = false;

            button.textContent =
                "Create Account";

        }

    }
);


function showMessage(
    text,
    type
) {

    message.textContent = text;

    message.className =
        "message " + type;

}

</script>


</body>

</html>
