<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JAYRIX Messenger</title>

    <meta
        name="theme-color"
        content="#050a14"
    >

    <meta
        name="mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        :root {
            --blue: #1683ff;
            --blue-bright: #35a7ff;
            --dark: #050a14;
            --dark-2: #080f1c;
            --dark-3: #0c1524;
            --line: rgba(255,255,255,0.07);
            --text: #f4f8ff;
            --muted: #7f8da3;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(22,131,255,0.16),
                    transparent 40%
                ),
                #02050b;

            color: var(--text);

            min-height: 100vh;

            overflow-x: hidden;
            overflow-y: auto;
        }


        /* APP */

        .app {

            width: 100%;

            max-width: 600px;

            min-height: 100vh;

            margin: auto;

            background:
                linear-gradient(
                    180deg,
                    #07101d 0%,
                    #050a14 45%,
                    #03070e 100%
                );

            display: flex;

            flex-direction: column;

            position: relative;
        }


        /* HEADER */

        .header {

            background:
                linear-gradient(
                    135deg,
                    rgba(13,32,58,0.98),
                    rgba(5,12,24,0.98)
                );

            padding: 18px 16px 14px;

            border-bottom:
                1px solid rgba(22,131,255,0.15);

            box-shadow:
                0 8px 30px rgba(0,0,0,0.35);

            position: sticky;

            top: 0;

            z-index: 10;
        }


        /* TOP BAR */

        .top-bar {

            display: flex;

            justify-content: space-between;

            align-items: center;
        }


        /* LOGO */

        .logo-section {

            display: flex;

            align-items: center;

            gap: 11px;
        }

        .logo {

            width: 43px;
            height: 43px;

            background:
                linear-gradient(
                    135deg,
                    #35a7ff,
                    #087cff
                );

            color: white;

            border-radius:
                50% 50% 50% 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 22px;

            font-weight: bold;

            box-shadow:
                0 0 12px rgba(22,131,255,0.55),
                inset 0 0 8px rgba(255,255,255,0.18);
        }

        .brand {

            font-size: 24px;

            font-weight: bold;

            letter-spacing: 2px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #6ebfff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color: transparent;
        }


        /* ICONS */

        .header-icons {

            display: flex;

            gap: 17px;

            font-size: 23px;
        }

        .icon {

            color: #b8c9df;

            cursor: pointer;

            user-select: none;

            transition:
                color 0.2s,
                transform 0.2s;
        }

        .icon:active {

            color: var(--blue-bright);

            transform: scale(0.9);
        }


        /* SEARCH */

        .search-container {

            margin-top: 15px;
        }

        .search {

            width: 100%;

            border:
                1px solid rgba(255,255,255,0.06);

            outline: none;

            padding: 13px 17px;

            border-radius: 25px;

            font-size: 15px;

            background:
                rgba(255,255,255,0.045);

            color: white;

            box-shadow:
                inset 0 1px 8px rgba(0,0,0,0.25);
        }

        .search::placeholder {

            color: #65748a;
        }

        .search:focus {

            border-color:
                rgba(22,131,255,0.55);

            box-shadow:
                0 0 15px
                rgba(22,131,255,0.12);
        }


        /* TABS */

        .tabs {

            display: flex;

            background:
                rgba(4,9,17,0.98);

            border-bottom:
                1px solid var(--line);

            position: sticky;

            top: 91px;

            z-index: 9;
        }

        .tab {

            flex: 1;

            padding: 15px 5px;

            text-align: center;

            font-weight: bold;

            color: #65748a;

            cursor: pointer;

            user-select: none;

            position: relative;

            transition:
                color 0.2s;
        }

        .tab.active {

            color: #43aaff;

            text-shadow:
                0 0 12px
                rgba(22,131,255,0.55);
        }

        .tab.active::after {

            content: "";

            position: absolute;

            bottom: 0;

            left: 25%;

            width: 50%;

            height: 3px;

            background:
                linear-gradient(
                    90deg,
                    #087cff,
                    #42b2ff
                );

            border-radius: 5px;

            box-shadow:
                0 0 10px
                rgba(22,131,255,0.8);
        }


        /* CONTENT */

        .content {

            width: 100%;

            min-height: 500px;

            padding-bottom: 100px;
        }


        /* EMPTY STATE */

        .empty {

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 90px 25px;

            color: #6c7c92;
        }

        .empty-icon {

            width: 75px;

            height: 75px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 34px;

            margin-bottom: 20px;

            background:
                rgba(22,131,255,0.08);

            border:
                1px solid
                rgba(22,131,255,0.2);

            box-shadow:
                0 0 25px
                rgba(22,131,255,0.12);
        }

        .empty h2 {

            color: #dceaff;

            margin-bottom: 8px;

            font-size: 20px;
        }

        .empty p {

            color: #65748a;

            font-size: 14px;

            max-width: 280px;

            line-height: 1.5;
        }


        /* FLOATING BUTTON */

        .new-chat {

            position: fixed;

            right: 20px;

            bottom: 25px;

            width: 58px;

            height: 58px;

            border-radius: 50%;

            border:
                1px solid
                rgba(110,191,255,0.5);

            background:
                linear-gradient(
                    135deg,
                    #1691ff,
                    #005bc1
                );

            color: white;

            font-size: 29px;

            box-shadow:
                0 0 22px
                rgba(22,131,255,0.45),

                0 8px 20px
                rgba(0,0,0,0.4);

            cursor: pointer;

            z-index: 20;
        }

        .new-chat:active {

            transform: scale(0.92);
        }


        /* STATUS / CALLS */

        .section-empty {

            min-height: 350px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;

            padding: 30px;
        }

        .section-empty-icon {

            font-size: 45px;

            margin-bottom: 15px;

            filter:
                drop-shadow(
                    0 0 12px
                    rgba(22,131,255,0.4)
                );
        }

        .section-empty h2 {

            color: #dceaff;

            margin-bottom: 8px;
        }

        .section-empty p {

            color: #65748a;

            font-size: 14px;
        }


        /* DESKTOP */

        @media (min-width: 700px) {

            body {

                display: flex;

                justify-content: center;

                align-items: center;

                padding: 20px;
            }

            .app {

                min-height: 95vh;

                max-height: 95vh;

                overflow-y: auto;

                border-radius: 18px;

                border:
                    1px solid
                    rgba(22,131,255,0.14);

                box-shadow:
                    0 0 50px
                    rgba(0,0,0,0.7),

                    0 0 25px
                    rgba(22,131,255,0.08);
            }

            .new-chat {

                position: absolute;
            }
        }

    </style>

</head>


<body>


<div class="app">


    <!-- HEADER -->

    <header class="header">

        <div class="top-bar">

            <div class="logo-section">

                <div class="logo">
                    J
                </div>

                <div class="brand">
                    JAYRIX
                </div>

            </div>


            <div class="header-icons">

                <span
                    class="icon"
                    onclick="showSearch()"
                >
                    ⌕
                </span>

                <span
                    class="icon"
                    onclick="showMenu()"
                >
                    ⋮
                </span>

            </div>

        </div>


        <div class="search-container">

            <input
                type="text"
                id="search"
                class="search"
                placeholder="Search chats..."
            >

        </div>

    </header>


    <!-- TABS -->

    <div class="tabs">

        <div
            class="tab active"
            id="chatsTab"
            onclick="showTab('chats')"
        >
            Chats
        </div>


        <div
            class="tab"
            id="statusTab"
            onclick="showTab('status')"
        >
            Status
        </div>


        <div
            class="tab"
            id="callsTab"
            onclick="showTab('calls')"
        >
            Calls
        </div>

    </div>


    <!-- CONTENT -->

    <main class="content">


        <!-- CHATS -->

        <section id="chats">

            <div class="empty">

                <div class="empty-icon">
                    💬
                </div>

                <h2>
                    No conversations yet
                </h2>

                <p>
                    Start a new conversation
                    using the blue button below.
                </p>

            </div>

        </section>


        <!-- STATUS -->

        <section
            id="status"
            style="display:none;"
        >

            <div class="section-empty">

                <div class="section-empty-icon">
                    ◉
                </div>

                <h2>
                    No status updates
                </h2>

                <p>
                    Status features will be
                    available soon.
                </p>

            </div>

        </section>


        <!-- CALLS -->

        <section
            id="calls"
            style="display:none;"
        >

            <div class="section-empty">

                <div class="section-empty-icon">
                    ☎
                </div>

                <h2>
                    No calls yet
                </h2>

                <p>
                    Your calls will appear here.
                </p>

            </div>

        </section>


    </main>


    <!-- NEW CHAT -->

    <button
        class="new-chat"
        onclick="newChat()"
        aria-label="New chat"
    >
        +
    </button>


</div>


<script>


    function showTab(tab) {

        const chats =
            document.getElementById("chats");

        const status =
            document.getElementById("status");

        const calls =
            document.getElementById("calls");


        const chatsTab =
            document.getElementById("chatsTab");

        const statusTab =
            document.getElementById("statusTab");

        const callsTab =
            document.getElementById("callsTab");


        chats.style.display = "none";

        status.style.display = "none";

        calls.style.display = "none";


        chatsTab.classList.remove("active");

        statusTab.classList.remove("active");

        callsTab.classList.remove("active");


        if (tab === "chats") {

            chats.style.display = "block";

            chatsTab.classList.add("active");

        }


        if (tab === "status") {

            status.style.display = "block";

            statusTab.classList.add("active");

        }


        if (tab === "calls") {

            calls.style.display = "block";

            callsTab.classList.add("active");

        }

    }


    function newChat() {

        alert(
            "New chat will be available after user accounts are connected."
        );

    }


    function showSearch() {

        document
            .getElementById("search")
            .focus();

    }


    function showMenu() {

        alert(
            "JAYRIX menu coming soon."
        );

    }


</script>


</body>

</html>
