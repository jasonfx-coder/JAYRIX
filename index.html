<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JAYRIX Messenger</title>

    <!-- PWA -->
    <meta name="theme-color" content="#050a14">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        :root {
            --blue: #1683ff;
            --blue-bright: #35a7ff;
            --dark: #050a14;
            --dark-2: #080f1c;
            --dark-3: #0c1524;
            --line: rgba(255,255,255,0.07);
            --text: #f4f8ff;
            --muted: #7f8da3;
        }

        body {
            background:
                radial-gradient(circle at 50% -10%, rgba(22,131,255,0.16), transparent 40%),
                #02050b;

            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        /* APP */

        .app {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            margin: auto;

            background:
                linear-gradient(
                    180deg,
                    #07101d 0%,
                    #050a14 45%,
                    #03070e 100%
                );

            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        /* HEADER */

        .header {
            background:
                linear-gradient(
                    135deg,
                    rgba(13,32,58,0.98),
                    rgba(5,12,24,0.98)
                );

            padding: 18px 16px 14px;

            border-bottom: 1px solid rgba(22,131,255,0.15);

            box-shadow:
                0 8px 30px rgba(0,0,0,0.35);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* LOGO */

        .logo-section {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .logo {
            width: 43px;
            height: 43px;

            background:
                linear-gradient(
                    135deg,
                    #35a7ff,
                    #087cff
                );

            color: white;

            border-radius:
                50% 50% 50% 9px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 22px;
            font-weight: bold;

            box-shadow:
                0 0 12px rgba(22,131,255,0.55),
                inset 0 0 8px rgba(255,255,255,0.18);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 2px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #6ebfff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* HEADER ICONS */

        .header-icons {
            display: flex;
            gap: 17px;
            font-size: 23px;
        }

        .icon {
            color: #b8c9df;
            cursor: pointer;

            transition:
                color 0.2s,
                transform 0.2s;
        }

        .icon:hover {
            color: var(--blue-bright);
            transform: scale(1.1);
        }

        /* SEARCH */

        .search-container {
            margin-top: 15px;
        }

        .search {
            width: 100%;

            border: 1px solid rgba(255,255,255,0.06);
            outline: none;

            padding: 13px 17px;

            border-radius: 25px;

            font-size: 15px;

            background:
                rgba(255,255,255,0.045);

            color: white;

            box-shadow:
                inset 0 1px 8px rgba(0,0,0,0.25);

            transition:
                border 0.2s,
                box-shadow 0.2s;
        }

        .search::placeholder {
            color: #65748a;
        }

        .search:focus {
            border-color: rgba(22,131,255,0.55);

            box-shadow:
                0 0 15px rgba(22,131,255,0.12);
        }

        /* TABS */

        .tabs {
            display: flex;

            background:
                rgba(4,9,17,0.95);

            border-bottom: 1px solid var(--line);
        }

        .tab {
            flex: 1;

            padding: 15px 5px;

            text-align: center;

            font-weight: bold;

            color: #65748a;

            cursor: pointer;

            position: relative;

            transition:
                color 0.2s
